<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>F1 Grand Prix</title>
<style>
:root{--bg:#e6e3db;--fg:#1b1d22;--muted:#5d6068;--red:#e10600;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0e1013;--fg:#f0eee8;--muted:#9a9ca4}}
:root[data-theme="dark"]{--bg:#0e1013;--fg:#f0eee8;--muted:#9a9ca4}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Trebuchet MS",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;overflow:hidden}
#stage{position:relative;overflow:hidden;border-radius:12px;background:#9ad1ec;box-shadow:0 6px 24px rgba(0,0,0,.35);color:#fff;touch-action:none}
#stage canvas.gl{display:block}
.abs{position:absolute;pointer-events:none;text-shadow:0 1px 4px #000}
#pos{top:10px;left:14px;font-size:34px;font-weight:800;line-height:1}
#lap{top:50px;left:14px;font-size:17px;font-weight:700}
#times{top:78px;left:14px;font-size:13px;line-height:1.5}
#map{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.4);border-radius:8px;pointer-events:none}
#dash{bottom:12px;left:50%;transform:translateX(-50%);text-align:center}
#spd{font-size:38px;font-weight:800;line-height:1}
#gear{font-size:15px;font-weight:700;margin:2px 0 6px}
.bars{display:flex;gap:6px;justify-content:center}
.bars i{display:block;width:70px;height:8px;background:rgba(255,255,255,.2);border-radius:4px;overflow:hidden;position:relative}
.bars b{position:absolute;inset:0 auto 0 0;width:0}
#msg{top:26%;width:100%;text-align:center;font-size:44px;font-weight:800}
.panel{touch-action:pan-y;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(10,12,16,.82);padding:18px 26px;border-radius:12px;text-align:center;max-width:90%;max-height:92%;overflow:auto;box-sizing:border-box}
.panel h1{margin:0 0 10px;font-size:28px}
.panel p{margin:6px 0;font-size:14px;color:#d8d8dc}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;text-align:left;font-size:14px}
.grid label{display:flex;flex-direction:column;gap:3px}
.grid .chk{flex-direction:row;align-items:center;gap:8px}
select,input[type=range]{font:inherit;width:100%;box-sizing:border-box}
button{font:inherit;font-weight:700;background:var(--red);color:#fff;border:0;border-radius:10px;padding:11px 24px;margin:6px 4px 0;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
button.alt{background:#3a3d45}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #ffd166;outline-offset:2px}
.touch{display:none;position:absolute;bottom:10px;left:10px;right:10px;justify-content:space-between;pointer-events:none}
.touch div{display:flex;gap:8px;pointer-events:auto}
.touch button{margin:0;padding:18px 20px;opacity:.75}
@media (pointer:coarse){.touch{display:flex}#dash{bottom:84px}}
.hint{font-size:12px;color:var(--muted);text-align:center;max-width:96vw}
</style>
</head>
<body>
<div id="stage">
  <div id="pos" class="abs"></div><div id="lap" class="abs"></div><div id="times" class="abs"></div>
  <canvas id="map" width="190" height="120"></canvas>
  <div id="dash" class="abs"><div id="spd"></div><div id="gear"></div>
    <div class="bars"><i><b id="thr" style="background:#3ddc84"></b></i><i><b id="brk" style="background:#ff4d4d"></b></i></div></div>
  <div id="msg" class="abs"></div>
  <div id="menu" class="panel">
    <h1>F1 Grand Prix</h1>
    <div class="grid">
      <label>Laps<select id="sLaps"><option>3</option><option selected>5</option><option>10</option></select></label>
      <label>Opponents<select id="sBots"><option>3</option><option selected>7</option><option>11</option></select></label>
      <label>Bot skill<select id="sDiff"><option value=".8">Easy</option><option value=".9" selected>Medium</option><option value=".98">Hard</option></select></label>
      <label>Camera<select id="sCam"><option value="0">Chase</option><option value="1">Close</option><option value="2">Top-down</option></select></label>
      <label>Downforce <span><output id="oDf">50</output>%</span><input type="range" id="sDf" min="0" max="100" value="50"></label>
      <label>Brake strength <span><output id="oBr">100</output>%</span><input type="range" id="sBr" min="60" max="140" value="100"></label>
      <label class="chk"><input type="checkbox" id="sAbs" checked>ABS (anti-lock brakes)</label>
      <label class="chk"><input type="checkbox" id="sSnd" checked>Engine sound</label>
    </div>
    <p>Low downforce gives a higher top speed but less grip in corners. Brake strength above 120% with ABS off can lock the front wheels.</p>
    <button id="go" type="button">Start race</button>
  </div>
  <div id="end" class="panel" style="display:none"></div>
  <div class="touch">
    <div><button data-k="l">◀</button><button data-k="r">▶</button></div>
    <div><button data-k="b">Brake</button><button data-k="g">Gas</button></div>
  </div>
</div>
<div class="hint">W / ↑ gas · S / ↓ / Space brake · A D / ← → steer · C camera · Esc menu</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
if(!window.THREE){document.body.textContent='Could not load the 3D engine. Check your connection and reload.'}
else{
const $=id=>$.c[id]||($.c[id]=document.getElementById(id));$.c={};
const stage=$('stage'),lerp=(a,b,t)=>a+(b-a)*t,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const wrap=a=>Math.atan2(Math.sin(a),Math.cos(a));
const fmt=t=>t==null?'-:--.---':Math.floor(t/60)+':'+(t%60).toFixed(3).padStart(6,'0');
const SKY=0x9ad1ec;
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.domElement.className='gl';stage.insertBefore(renderer.domElement,stage.firstChild);
const scene=new THREE.Scene();scene.background=new THREE.Color(SKY);scene.fog=new THREE.Fog(SKY,160,750);
const cam=new THREE.PerspectiveCamera(62,1,.5,1500);
scene.add(new THREE.AmbientLight(0xffffff,.78));
const sun=new THREE.DirectionalLight(0xffffff,.85);sun.position.set(80,160,60);scene.add(sun);
function fit(){const w=Math.floor(Math.min(innerWidth*.98,1200)),h=Math.floor(innerHeight-50);
  stage.style.width=w+'px';stage.style.height=h+'px';renderer.setSize(w,h);cam.aspect=w/h}
addEventListener('resize',fit);fit();

// materials and helpers
const mc={},M=c=>mc[c]||(mc[c]=new THREE.MeshLambertMaterial({color:c}));
const mesh=(g,m,x,y,z)=>{const o=new THREE.Mesh(g,m);o.position.set(x||0,y||0,z||0);return o};
const DS=THREE.DoubleSide;

// ---- track ----
const CP=[[-250,0],[0,0],[300,0],[480,30],[560,140],[500,260],[380,300],[330,380],[380,470],[300,540],[150,520],[60,430],[-40,400],[-150,440],[-300,400],[-380,300],[-340,180],[-420,100],[-380,20]]
  .map(([x,z])=>new THREE.Vector3(x,0,z));
const curve=new THREE.CatmullRomCurve3(CP,true,'centripetal');
const N=700,L=curve.getLength(),pts=curve.getSpacedPoints(N);pts.pop();
const D=L/N,TW=16,TX=[],TZ=[],KAP=[];
for(let i=0;i<N;i++){const a=pts[(i+1)%N],b=pts[(i+N-1)%N];let x=a.x-b.x,z=a.z-b.z;const m=Math.hypot(x,z);TX[i]=x/m;TZ[i]=z/m}
for(let i=0;i<N;i++){const a=(i+4)%N,b=(i+N-4)%N;
  KAP[i]=Math.abs(Math.atan2(TX[b]*TZ[a]-TZ[b]*TX[a],TX[b]*TX[a]+TZ[b]*TZ[a]))/(8*D)}
// bot speed profile (m/s): corner limit, then braking and acceleration limits
const prof=KAP.map(k=>Math.min(88,k>1e-4?Math.sqrt(44/k):88));
for(let j=2*N;j>0;j--){const i=j%N,q=(j-1)%N;prof[q]=Math.min(prof[q],Math.sqrt(prof[i]**2+2*34*D))}
for(let j=1;j<=2*N;j++){const i=(j-1)%N,q=j%N;prof[q]=Math.min(prof[q],Math.sqrt(prof[i]**2+2*13*D))}
function ribbon(o0,o1,y,mat,colFn){
  const pos=[],col=[],idx=[];
  for(let i=0;i<=N;i++){const k=i%N;for(const o of [o0,o1]){pos.push(pts[k].x-TZ[k]*o,y,pts[k].z+TX[k]*o);
    if(colFn){const c=colFn(i);col.push(c.r,c.g,c.b)}}}
  for(let i=0;i<N;i++){const a=2*i;idx.push(a,a+1,a+2,a+1,a+3,a+2)}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  if(colFn)g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  g.setIndex(idx);g.computeVertexNormals();scene.add(new THREE.Mesh(g,mat));
}
const ground=mesh(new THREE.PlaneGeometry(3000,3000),M(0x2f6d3a),100,-.05,270);ground.rotation.x=-Math.PI/2;scene.add(ground);
ribbon(-TW/2,TW/2,.02,new THREE.MeshLambertMaterial({color:0x2e3138,side:DS}));
const line=new THREE.MeshBasicMaterial({color:0xffffff,side:DS});
ribbon(-TW/2+.2,-TW/2+.55,.035,line);ribbon(TW/2-.55,TW/2-.2,.035,line);
const KR=new THREE.Color(0xd62f2f),KW=new THREE.Color(0xf2f2f2),kc=i=>Math.floor(i/2)%2?KR:KW;
const kmat=new THREE.MeshLambertMaterial({vertexColors:true,side:DS});
ribbon(-TW/2-1.6,-TW/2,.03,kmat,kc);ribbon(TW/2,TW/2+1.6,.03,kmat,kc);
const H0=Math.atan2(TX[0],-TZ[0]),gantry=new THREE.Group();gantry.position.set(pts[0].x,0,pts[0].z);gantry.rotation.y=-H0;
gantry.add(mesh(new THREE.BoxGeometry(TW,.03,1.6),line,0,.04,0),mesh(new THREE.BoxGeometry(TW+5,1.3,1.2),M(0x1b1d22),0,9,0));
[-1,1].forEach(s=>gantry.add(mesh(new THREE.CylinderGeometry(.4,.4,9,8),M(0x888c94),s*(TW/2+2.2),4.5,0)));
scene.add(gantry);
const trG=new THREE.CylinderGeometry(.3,.35,2,6),lfG=new THREE.ConeGeometry(2.2,6,7);
for(let n=0;n<160;n++){const x=-700+Math.random()*1500,z=-250+Math.random()*1000;let ok=true;
  for(let i=0;i<N;i+=4)if(Math.hypot(pts[i].x-x,pts[i].z-z)<38){ok=false;break}
  if(!ok)continue;const t=new THREE.Group(),s=.8+Math.random()*.9;
  t.add(mesh(trG,M(0x6b4a2b),0,1,0),mesh(lfG,M(Math.random()<.5?0x2d6a3a:0x24572f),0,5,0));t.position.set(x,0,z);t.scale.set(s,s,s);scene.add(t)}
function posAt(s,off){
  const f=(((s%L)+L)%L)/D,i=Math.floor(f)%N,j=(i+1)%N,fr=f-Math.floor(f);
  let tx=lerp(TX[i],TX[j],fr),tz=lerp(TZ[i],TZ[j],fr);const m=Math.hypot(tx,tz);tx/=m;tz/=m;
  return{x:lerp(pts[i].x,pts[j].x,fr)-tz*off,z:lerp(pts[i].z,pts[j].z,fr)+tx*off,h:Math.atan2(tx,-tz),i};
}

// ---- F1 car ----
const GB=new THREE.BoxGeometry(.9,.45,3.4),GN=new THREE.ConeGeometry(.32,2.2,8),GS=new THREE.BoxGeometry(1.6,.36,1.7),GA=new THREE.BoxGeometry(.45,.5,1),
  GFW=new THREE.BoxGeometry(2.1,.07,.55),GRW=new THREE.BoxGeometry(1.5,.07,.5),GSP=new THREE.BoxGeometry(.12,.7,.15),GE=new THREE.BoxGeometry(.06,.3,.6),
  GE2=new THREE.BoxGeometry(.05,.5,.55),GWF=new THREE.CylinderGeometry(.33,.33,.4,14),GWR=new THREE.CylinderGeometry(.37,.37,.5,14),
  GH=new THREE.SphereGeometry(.2,10,8),GBL=new THREE.BoxGeometry(.5,.14,.05),GSH=new THREE.PlaneGeometry(2.6,6.4);
const dark=M(0x16181d),rubber=M(0x0e0e10),shm=new THREE.MeshBasicMaterial({color:0,transparent:true,opacity:.35,depthWrite:false});
function f1(col,helm){
  const g=new THREE.Group(),c=M(col),bl=new THREE.MeshBasicMaterial({color:0x5a0000});
  const add=(geo,mat,x,y,z,rx)=>{const m=mesh(geo,mat,x,y,z);if(rx)m.rotation.x=rx;g.add(m);return m};
  add(GB,c,0,.5,.3);add(GN,c,0,.45,-2.3,-Math.PI/2);add(GS,c,0,.42,.6);add(GA,c,0,1,.8);
  add(GFW,dark,0,.2,-3.3);add(GRW,dark,0,1.2,2.2);add(GSP,dark,0,.8,2.1);add(GH,M(helm),0,.9,-.2);add(GBL,bl,0,.55,2.03);
  [-1,1].forEach(s=>{add(GE,dark,s*1.05,.28,-3.3);add(GE2,dark,s*.75,1.2,2.2);
    add(GWF,rubber,s*1.0,.33,-1.7).rotation.z=Math.PI/2;add(GWR,rubber,s*1.0,.37,1.5).rotation.z=Math.PI/2});
  const sh=add(GSH,shm,0,.05,0,-Math.PI/2);sh.position.z=-.2;
  scene.add(g);return{g,bl};
}
const TEAM=[0xff8000,0x1e41ff,0x00d2be,0x229971,0xffd500,0x9b0000,0xf0f0f0,0x6692ff,0xb6babd,0xff4fa3,0x7b2ff7,0x00a3e0];

// ---- state ----
const T={},keys={};let S={},st='menu',p,bots=[],cars=[],clk=0,cdT=0,goT=0,camH=0,bestLap=null,lastLap=null;
const pl=f1(0xe10600,0xffffff);
function readSettings(){S={laps:+$('sLaps').value,bots:+$('sBots').value,diff:+$('sDiff').value,cam:+$('sCam').value,
  df:+$('sDf').value/100,brake:+$('sBr').value/100,abs:$('sAbs').checked,snd:$('sSnd').checked}}
function setup(){
  readSettings();bots.forEach(b=>scene.remove(b.m.g));bots=[];clk=0;goT=0;bestLap=null;lastLap=null;
  const ps=Math.min(3,S.bots);
  for(let slot=0;slot<=S.bots;slot++){
    const s=-10-Math.floor(slot/2)*9,off=slot%2?3.5:-3.5,q=posAt(s,off);
    if(slot===ps){p={x:q.x,z:q.z,h:q.h,v:0,thr:0,brk:0,st:0,lap:0,last:q.i,lapT:0,dev:0,m:pl};camH=q.h}
    else{const k=bots.length,m=f1(TEAM[k%TEAM.length],0x222222);
      bots.push({x:q.x,z:q.z,h:q.h,v:0,s,off,lane:off,sk:S.diff*(.97+Math.random()*.06),m,brk:0})}
  }
  cars=[...bots,p];
}
function show(id,on){$(id).style.display=on?'block':'none'}
function toMenu(){st='menu';setup();show('menu',1);show('end',0);$('msg').textContent=''}
function startRace(){setup();initAudio();st='countdown';cdT=3;show('menu',0);show('end',0)}
function rank(){const pr=p.lap-1+p.last/N;let n=1;bots.forEach(b=>{if(b.s/L>pr)n++});return n}
function finish(){
  st='done';const r=rank();show('end',1);
  $('end').innerHTML='<h1>'+(r===1?'Victory!':r<=3?'Podium: P'+r:'Finished P'+r)+'</h1><p>Best lap '+fmt(bestLap)+'</p>'
    +'<button id="again" type="button">Race again</button><button id="tomenu" class="alt" type="button">Settings</button>';
  document.getElementById('again').onclick=startRace;document.getElementById('tomenu').onclick=toMenu;
}

// ---- audio ----
let ac,osc,gn;
function initAudio(){if(!S.snd||ac)return;
  try{ac=new(window.AudioContext||window.webkitAudioContext)();osc=ac.createOscillator();osc.type='sawtooth';
    const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=900;gn=ac.createGain();gn.gain.value=0;
    osc.connect(f);f.connect(gn);gn.connect(ac.destination);osc.start()}catch(e){ac=null}}

// ---- player physics ----
function stepPlayer(dt){
  const racing=st==='race',fin=st==='done';
  const L_=keys.a||keys.ArrowLeft||T.l,R_=keys.d||keys.ArrowRight||T.r;
  const thrIn=racing&&(keys.w||keys.ArrowUp||T.g)?1:0;
  const brkIn=st==='countdown'?1:fin?.5:racing&&(keys.s||keys.ArrowDown||keys[' ']||T.b)?1:0;
  const sIn=racing?(R_?1:0)-(L_?1:0):0;
  p.thr+=(thrIn-p.thr)*Math.min(1,dt*6);p.brk+=(brkIn-p.brk)*Math.min(1,dt*(brkIn>p.brk?7:12));
  p.st+=(sIn-p.st)*Math.min(1,dt*(sIn?6:10));
  const grass=p.dev>TW/2+1.6;
  let topV=95-22*S.df,grip=28+34*S.df;if(grass){topV*=.35;grip*=.5}
  let v=p.v;
  const acc=clamp(24*(1-Math.pow(v/topV,1.6)),-25,24);
  let dv=p.thr*acc-(1-p.thr)*(2+v*v*.0012);
  const lock=!S.abs&&p.brk*S.brake>1.15&&Math.abs(p.st)>.25&&v>15;
  dv-=p.brk*42*S.brake*(lock?.7:1);
  v=Math.max(0,v+dv*dt);
  let w=p.st*2.2/(1+v/70)*Math.min(1,v/4);
  if(lock)w*=.35;
  const lat=v*Math.abs(w);
  if(lat>grip){const over=lat-grip;w=Math.sign(w)*grip/Math.max(v,1);v*=1-Math.min(.5,over/grip)*.6*dt}
  p.h+=w*dt;p.v=v;p.x+=Math.sin(p.h)*v*dt;p.z-=Math.cos(p.h)*v*dt;
  // nearest track point
  let bi=0,bd=1e12;for(let i=0;i<N;i++){const dx=pts[i].x-p.x,dz=pts[i].z-p.z,d=dx*dx+dz*dz;if(d<bd){bd=d;bi=i}}
  p.dev=Math.sqrt(bd);
  if(p.last>N*.8&&bi<N*.2){p.lap++;if(p.lap>=2){lastLap=clk-p.lapT;bestLap=bestLap==null?lastLap:Math.min(bestLap,lastLap)}p.lapT=clk;if(p.lap>S.laps)finish()}
  else if(p.last<N*.2&&bi>N*.8)p.lap--;
  p.last=bi;p.wrong=v>5&&Math.sin(p.h)*TX[bi]-Math.cos(p.h)*TZ[bi]<-.3;p.grass=grass;p.lock=lock;
  // bump bots
  for(const b of bots){const dx=p.x-b.x,dz=p.z-b.z,d=Math.hypot(dx,dz);
    if(d<3.4&&d>.01){p.x+=dx/d*(3.4-d);p.z+=dz/d*(3.4-d);p.v*=1-2.5*dt}}
}
function stepBots(dt){
  for(const b of bots){
    if(st==='race'||st==='done'){
      let tgt=prof[Math.floor((((b.s%L)+L)%L)/D)%N]*b.sk,near=false;
      const fx=Math.sin(b.h),fz=-Math.cos(b.h);
      for(const o of cars){if(o===b)continue;const dx=o.x-b.x,dz=o.z-b.z,ah=dx*fx+dz*fz,sd=dx*-fz+dz*fx;
        if(ah>0&&ah<18&&Math.abs(sd)<2.8){tgt=Math.min(tgt,o.v*.95+Math.max(0,ah-6)*1.5);b.off+=(sd>0?-1:1)*3*dt;near=true}}
      if(!near)b.off+=(b.lane-b.off)*.8*dt;b.off=clamp(b.off,-5.8,5.8);
      b.v+=clamp(tgt-b.v,-45*dt,18*dt);b.s+=b.v*dt;b.brk=tgt<b.v-2?1:0;
    }
    const q=posAt(b.s,b.off);b.x=q.x;b.z=q.z;b.h=q.h;
    b.m.g.position.set(b.x,0,b.z);b.m.g.rotation.y=-b.h;b.m.bl.color.setHex(b.brk?0xff2020:0x5a0000);
  }
}

// ---- minimap ----
const mp=$('map').getContext('2d');let mnx=1e9,mxx=-1e9,mnz=1e9,mxz=-1e9;
pts.forEach(q=>{mnx=Math.min(mnx,q.x);mxx=Math.max(mxx,q.x);mnz=Math.min(mnz,q.z);mxz=Math.max(mxz,q.z)});
const msc=Math.min(170/(mxx-mnx),100/(mxz-mnz)),mox=(190-(mxx-mnx)*msc)/2,moz=(120-(mxz-mnz)*msc)/2;
const mx=x=>mox+(x-mnx)*msc,mz=z=>moz+(z-mnz)*msc,mpath=new Path2D();
pts.forEach((q,i)=>i?mpath.lineTo(mx(q.x),mz(q.z)):mpath.moveTo(mx(q.x),mz(q.z)));mpath.closePath();
function drawMap(){
  mp.clearRect(0,0,190,120);mp.lineWidth=5;mp.strokeStyle='#8a8d96';mp.lineJoin='round';mp.stroke(mpath);
  bots.forEach((b,i)=>{mp.fillStyle='#'+TEAM[i%TEAM.length].toString(16).padStart(6,'0');mp.beginPath();mp.arc(mx(b.x),mz(b.z),3,0,7);mp.fill()});
  mp.fillStyle='#fff';mp.strokeStyle='#e10600';mp.lineWidth=2;mp.beginPath();mp.arc(mx(p.x),mz(p.z),4.5,0,7);mp.fill();mp.stroke();
}

// ---- input ----
addEventListener('keydown',e=>{
  const k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=true;
  if(st!=='menu'&&[' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();
  if(k==='c'&&st!=='menu'){S.cam=(S.cam+1)%3;$('sCam').value=S.cam}
  if((k==='Escape'||k==='r')&&st!=='menu')toMenu();
});
addEventListener('keyup',e=>{keys[e.key.length===1?e.key.toLowerCase():e.key]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;for(const k in T)T[k]=0});
document.querySelectorAll('.touch button').forEach(b=>{const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{T[k]=1;b.setPointerCapture(e.pointerId)});
  ['pointerup','pointercancel','pointerleave'].forEach(n=>b.addEventListener(n,()=>{T[k]=0}))});
$('go').onclick=startRace;
$('sDf').oninput=()=>$('oDf').textContent=$('sDf').value;$('sBr').oninput=()=>$('oBr').textContent=$('sBr').value;
$('sCam').onchange=()=>{S.cam=+$('sCam').value};

// ---- loop ----
const CAMS=[[11,4.2,12],[6.5,2.2,14],[8,75,0]];
setup();
let last=performance.now();
function loop(t){
  const dt=Math.min(.05,(t-last)/1000);last=t;
  if(st==='countdown'){cdT-=dt;if(cdT<=0){st='race';goT=1.2}}
  if(st==='race'){clk+=dt;if(goT>0)goT-=dt}
  if(st!=='menu'){stepPlayer(dt)}
  stepBots(dt);
  p.m.g.position.set(p.x,0,p.z);p.m.g.rotation.y=-p.h;p.m.bl.color.setHex(p.brk>.1?0xff2020:0x5a0000);
  // camera
  camH+=wrap(p.h-camH)*(1-Math.exp(-6*dt));
  const cf=CAMS[S.cam]||CAMS[0],fx=Math.sin(camH),fz=-Math.cos(camH);
  if(st==='menu'){camH+=dt*.25}
  cam.position.set(p.x-fx*cf[0],cf[1],p.z-fz*cf[0]);cam.lookAt(p.x+fx*cf[2],.8,p.z+fz*cf[2]);
  cam.fov+=((S.cam===2?50:60+p.v*.18)-cam.fov)*.1;cam.updateProjectionMatrix();
  // hud
  const spd=Math.round(p.v*3.6),topV=95-22*S.df,gs=topV/8,gear=clamp(Math.ceil(p.v/gs),1,8);
  $('spd').textContent=spd+' km/h';$('gear').textContent=p.v<1?'N':'Gear '+gear;
  $('thr').style.width=p.thr*100+'%';$('brk').style.width=p.brk*100+'%';
  $('pos').textContent='P'+rank()+' / '+(bots.length+1);
  $('lap').textContent='Lap '+clamp(p.lap,1,S.laps)+' / '+S.laps;
  $('times').innerHTML='Lap '+fmt(p.lap>=1?clk-p.lapT:null)+'<br>Last '+fmt(lastLap)+'<br>Best '+fmt(bestLap);
  $('msg').textContent=st==='countdown'?Math.ceil(cdT):goT>0?'GO!':st==='race'&&p.wrong?'Wrong way':st==='race'&&p.grass?'Off track':p.lock&&st==='race'?'Brakes locked':'';
  drawMap();
  if(ac){const f=(p.v-(gear-1)*gs)/gs,on=st==='countdown'||st==='race';
    osc.frequency.setTargetAtTime(80+clamp(f,0,1)*230+p.thr*25,ac.currentTime,.05);
    gn.gain.setTargetAtTime(on&&S.snd?.03+.05*p.thr:0,ac.currentTime,.1)}
  renderer.render(scene,cam);requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
}
</script>
